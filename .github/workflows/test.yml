# The tests that need no browser, plus the single-file build. Fast, and it runs on every push.

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self-tests (61 checks, no browser)
        run: node tests/self-tests.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The single-file build must still build
        run: python3 scripts/build.py
      # A link a doctor can click is fine; a RESOURCE fetched from another host is not.
      # This must stay a check on script/img/link/iframe, or it fails on the GitHub
      # link in the sidebar and proves nothing about the app going offline.
      - name: The build must load nothing from another host
        run: |
          set -e
          if grep -Eq '<(script|img|link|iframe)[^>]+(src|href)="https?://' dist/opd-register.html; then
            echo "::error::the single-file build loads a resource from an external host"
            grep -Eo '<(script|img|link|iframe)[^>]+(src|href)="https?://[^"]+"' dist/opd-register.html | head -5
            exit 1
          fi
          if grep -Eq '<script src=|<link rel="stylesheet"' dist/opd-register.html; then
            echo "::error::an asset was not inlined"
            exit 1
          fi
          echo "single file: no external resources, everything inlined"
