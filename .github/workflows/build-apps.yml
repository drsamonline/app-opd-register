# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# The pipeline itself lives in the public app-builder kit, so a fix there reaches every
# app at once. Do not inline it: a hand-copied version once kept `if: always()` on the
# release job, so a FAILED build destroyed the published release.
#
# Every push to main: build the portable EXE and the APK -> publish the rolling
# `app-latest` release -> deploy the demo to Pages. All three come from the same commit,
# so the live demo and the released build can never disagree.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@main
    with:
      app_name: app-opd-register
      app_src: docs/play
      # Pages is served from main:/docs by GitHub's own branch build (build_type legacy),
      # the same as the rest of the fleet. The pipeline builds and releases; it does not
      # deploy, so there is exactly one thing publishing the site.
      release_notes: .github/release-notes.md
    permissions:
      contents: write
      pages: write
      actions: write
      id-token: write
