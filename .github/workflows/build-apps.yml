# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# The pipeline itself lives in the public app-builder kit, so a fix there reaches every
# app at once. Do not inline it: a hand-copied version once kept `if: always()` on the
# release job, so a FAILED build destroyed the published release.
#
# Every push to main: build the portable EXE and the APK -> publish the rolling
# `app-latest` release -> deploy the demo to Pages. All three come from the same commit,
# so the live demo and the released build can never disagree.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@main
    with:
      app_name: app-opd-register
      app_src: docs/play
      # Pages is served from main:/docs by GitHub's own branch build (build_type legacy),
      # the same as the rest of the fleet. The pipeline builds and releases; it does not
      # deploy, so there is exactly one thing publishing the site.
      release_notes: .github/release-notes.md
    permissions:
      contents: write
      pages: write
      actions: write
      id-token: write

  # The kit builds the EXE, the APK and the Linux binary. It does not build the single
  # HTML file — that one is ours, and it went stale the moment it was uploaded by hand.
  # This job rebuilds it from the same commit and replaces it on the same release.
  html:
    name: Single-file HTML
    needs: app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 scripts/build.py
      - name: It must load nothing from another host
        run: |
          set -e
          if grep -Eq '<(script|img|link|iframe)[^>]+(src|href)="https?://' dist/opd-register.html; then
            echo "::error::the single-file build loads a resource from an external host"
            exit 1
          fi
          ls -l dist/opd-register.html
      # The asset name is the FILE name, not the label. Uploading dist/opd-register.html
      # with a "#app-opd-register.html" label created a SECOND asset instead of replacing
      # the first — so copy it to the name the release already uses, then clobber.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp dist/opd-register.html dist/app-opd-register.html
          gh release upload app-latest dist/app-opd-register.html --clobber --repo "${{ github.repository }}"
          gh release view app-latest --repo "${{ github.repository }}" --json assets \
            --jq '[.assets[].name] | join(", ")'
